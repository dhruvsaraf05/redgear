[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redgear"
version = "0.1.0"
description = "An autonomous orchestrator that plans software projects, generates task prompts, drives a coding agent CLI in a continuous verified loop, and refuses to accept unproven work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Dhruv Saraf" },
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich",
]

[project.scripts]
redgear = "redgear.cli:app"

[project.optional-dependencies]
# Exact pins, not floors. These tools gate the build: ruff and mypy add rules
# between releases, so a floor means CI resolves a newer version than the one
# the code was checked against and fails on lint that passes locally. That
# also fails the test suite, because tests/test_smoke.py shells out to both.
# Pinned to the versions this tree actually passes against; bump deliberately,
# never incidentally. Every pin here satisfies the floors CLAUDE.md §2.1
# requires, and all support Python >=3.10 so the 3.11/3.12 CI matrix resolves.
# Runtime dependencies above stay as floors -- they are what downstream
# installs must tolerate, not what gates this build.
dev = [
    "pytest==9.1.1",
    "pytest-json-report==1.5.0",
    "pytest-cov==7.1.0",
    "coverage==7.15.4",
    "mypy==2.3.0",
    "ruff==0.16.2",
    "pyyaml==6.0.3",
    "build==1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["redgear"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff formats/lints fenced Python blocks in Markdown by default; this repo's
# Markdown files (CLAUDE.md in particular) contain illustrative pseudocode,
# not source to be reformatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test suite.
# S603/S607: tests invoke git and dev tools by bare name via PATH on fixed,
# non-attacker-controlled argument lists -- this is standard test-harness
# practice, not untrusted subprocess input.
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["redgear"]

[tool.pytest.ini_options]
markers = [
    "smoke: quick checks that packaging, tooling, and state files are sound",
]

[tool.coverage.run]
branch = true
source = ["redgear"]
