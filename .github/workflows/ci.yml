name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff format --check .

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=redgear --cov-report=term-missing --cov-fail-under=85

  secrets-and-egress:
    name: G5 secret & egress hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # These match a credential *read* (os.environ[...] / os.getenv(...)),
      # not a bare mention of the name. The previous form matched the literal
      # string anywhere under redgear/, so a docstring citing the rule --
      # which CLAUDE.md §10.3 itself does -- would trip the gate enforcing it.
      # Tradeoff: an indirect read via a variable holding the key name
      # (k = "ANTHROPIC_API_KEY"; os.environ[k]) is no longer caught here.
      # gitleaks above and code review remain the backstop for that.
      - name: No credential reads in package
        run: |
          if grep -rnE "(environ|getenv)[^\n]*(ANTHROPIC|OPENAI|GEMINI)_API_KEY" redgear/; then
            echo "::error::package reads an auth environment variable (violates G5)"
            exit 1
          fi
          echo "ok — no credential reads"

      - name: No network clients in package
        run: |
          if grep -rnE "^[[:space:]]*(import|from)[[:space:]]+(httpx|urllib|socket|requests)\b" redgear/; then
            echo "::error::package imports a network client (violates G5)"
            exit 1
          fi
          echo "ok — no network imports"
